<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lebara Hub · Lebara Nigeria</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23242EE0' d='M24 0H76A24 24 0 0 1 100 24V76A24 24 0 0 1 76 100H6A6 6 0 0 1 0 94V24A24 24 0 0 1 24 0Z'/%3E%3Cpath fill='%23fff' d='M31 21H50V61H73V79H31Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#242EE0; --blue-dk:#1A22A8; --blue-2:#3A44F0; --sky:#D8E3FF; --sky-2:#F4F7FF;
  --pink:#E300B6; --pink-soft:#FCE3F6; --pink-ink:#8A006E; --pink-line:#B0008D;
  --ink:#12153A; --ink-2:#3B4166; --ink-3:#2B2F55; --muted:#5A6072;
  --bg:#F3F5FB; --card:#FFFFFF; --line:#E6E9F4; --input:#D5DAEA; --neutral:#EEF0F6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45}
a{color:var(--blue)} a:hover{color:var(--blue-dk)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.sr{position:absolute;left:-9999px}
[hidden]{display:none!important}

/* ---------- app shell (sidebar + top bar) ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,#fff 0 251px,var(--line) 251px 252px,var(--bg) 252px)}
.side{background:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);padding:2px 10px 18px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.logo{display:block;flex:0 0 auto;shape-rendering:geometricPrecision}
.brand b{display:block;font-size:16px;font-weight:800;line-height:1.2}
.brand small{display:block;font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.02em}
.side a,.side summary{text-decoration:none;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);font-weight:500;min-height:42px;cursor:pointer}
.side a:hover,.side summary:hover{background:var(--bg);color:var(--ink)}
.side a.on{background:var(--sky-2);color:var(--blue);font-weight:700;box-shadow:inset 3px 0 0 var(--blue)}
.side a.brand{padding:6px 10px 22px;border-radius:0;margin-bottom:22px;min-height:0}
.side a.brand:hover{background:none}
.side summary{list-style:none}
.side summary::-webkit-details-marker{display:none}
.side summary .car{margin-left:auto;transition:transform .15s;color:var(--muted)}
.side details[open] summary .car{transform:rotate(180deg)}
.side details.has-on > summary{color:var(--blue);font-weight:700}
.side .sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 22px;padding-left:10px;border-left:1px solid var(--line)}
.side .sub a{min-height:36px;padding:8px 10px;font-size:13.5px}
.side .grp{margin:12px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.side .tag{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--pink-ink);background:var(--pink-soft);padding:3px 7px;border-radius:999px}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}

.wrap{min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;height:68px;display:flex;align-items:center;gap:16px;padding:0 28px}
.search{flex:1;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 14px;height:42px;color:var(--muted)}
.search input{border:0;background:transparent;flex:1;outline:none;min-width:0;font-size:14px;color:var(--ink)}
.top-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{position:relative;width:44px;height:44px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn:hover{background:var(--bg)}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--pink);border:2px solid #fff}
.me{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 4px;border-radius:999px;border:0;background:transparent;cursor:pointer}
.me:hover{background:var(--bg)}
.me .av{width:38px;height:38px}
.menu{position:absolute;right:24px;top:62px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(18,21,58,.12);padding:8px;width:250px;z-index:40}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block;font-size:14px} .menu .who small{font-size:12px;color:var(--muted)} .menu .who em{font-style:normal;color:var(--blue);font-weight:700}
.menu label{display:block;font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px 4px}
.menu select{width:100%;height:40px;border:1px solid var(--input);border-radius:10px;padding:0 10px;background:#fff;margin-bottom:6px}
.menu button{width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;cursor:pointer;font-weight:600}
.menu button:hover{background:var(--bg)}
.apps{position:absolute;right:80px;top:62px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(18,21,58,.12);padding:12px;width:300px;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.apps a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:600;text-align:center}
.apps a:hover{background:var(--bg);color:var(--ink)}
.pwmeter{height:6px;border-radius:4px;background:var(--neutral);overflow:hidden;margin-top:8px} .pwmeter i{display:block;height:100%;width:0;background:var(--pink);transition:width .2s}
.pwrules{list-style:none;padding:0;margin:8px 0 0;font-size:13px;color:var(--muted);display:grid;gap:4px} .pwrules li.ok{color:var(--blue);font-weight:600} .pwrules li::before{content:'○ '} .pwrules li.ok::before{content:'✓ '}
.pwwrap{position:relative} .pwwrap .inp{padding-right:64px} .pwwrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:6px}
.formerr{color:var(--pink-ink);font-weight:600;font-size:14px}
.sheet td{padding:6px 6px;vertical-align:middle} .sheet .inp{height:40px;padding:0 10px;font-size:14px;min-width:0;width:100%}
.sheet select.inp{padding-right:28px} .sheet td.n{width:34px;color:var(--muted);font-weight:700;text-align:center}
.sheet .x{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted)} .sheet .x:hover{color:var(--pink-ink);border-color:var(--pink)}
.savestate{font-size:13px;font-weight:600;color:var(--muted)} .savestate.ok{color:var(--blue)}
.st-Done{background:var(--blue);color:#fff} .st-Blocked{background:var(--pink-soft);color:var(--pink-ink)} .st-In{background:var(--sky);color:#1A22A8} .st-Not{background:var(--neutral);color:var(--ink-2)}
.today{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.clockcard{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.clockcard .time{font-size:34px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi.warn b{color:var(--pink-ink)}
.seg{display:inline-flex;background:var(--neutral);border-radius:12px;padding:4px;gap:4px}
.seg a{padding:8px 14px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px}
.seg a.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qty{font-variant-numeric:tabular-nums;font-weight:800}
@media (max-width:900px){ .today{grid-template-columns:minmax(0,1fr)} }
.menu.notif{right:128px;width:330px;padding:8px}
.menu.notif .nh{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu.notif .nh button{width:auto;padding:4px 8px;font-size:12px;color:var(--blue)}
.menu.notif a{display:flex;gap:10px;padding:10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.35}
.menu.notif a:hover{background:var(--bg)}
.menu.notif a i{flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
.menu.notif a.unread i{background:var(--pink)} .menu.notif a.unread b{font-weight:800}
.menu.notif a small{display:block;font-size:12px;color:var(--muted)}
a.ev{text-decoration:none;color:var(--ink);border-radius:10px} a.ev:hover b.t{color:var(--blue)}
.linkish{background:none;border:0;padding:0;color:var(--blue);font-weight:600;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.result{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.result:hover b{color:var(--blue)} .result small{display:block;font-size:12px;color:var(--muted)}
.result .ri{flex:0 0 40px;height:40px;border-radius:10px;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center}
.prose p{font-size:16px;line-height:1.75;color:var(--ink-3);margin-bottom:14px}
.prose ol{padding-left:22px;line-height:1.9;color:var(--ink-2)}
.apps a span{width:40px;height:40px;border-radius:10px;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center}
.hamb{display:none}
main.main{padding:28px 32px 40px;width:100%;max-width:1280px}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

/* ---------- home (template) ---------- */
.hello h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
.hello p{color:var(--muted);font-size:16px;margin-top:4px}
.hrow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(280px,1fr);gap:20px}
.hrow2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.panel .ph h2{font-size:17px;font-weight:800}
.panel .ph a{font-size:14px;font-weight:700;text-decoration:none}
.hero{position:relative;min-height:240px;border-radius:14px;overflow:hidden;background:var(--sky);display:flex}
.hero .copy{position:relative;z-index:2;width:58%;background:var(--blue);color:#fff;padding:30px 60px 30px 30px;clip-path:polygon(0 0,100% 0,84% 100%,0 100%);display:flex;flex-direction:column;justify-content:center;gap:10px}
.hero .copy .eyebrow{color:var(--sky);font-size:12px}
.hero .copy h2{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.hero .copy p{color:#E4E9FF;font-size:15px;max-width:340px}
.hero .copy .btn{align-self:flex-start;margin-top:8px;background:#fff;color:var(--ink);height:42px}
.hero .copy .btn:hover{background:var(--sky-2);color:var(--ink)}
.hero .pic{position:absolute;right:0;top:0;bottom:0;width:52%;display:flex;align-items:center;justify-content:center}
.hero .ring{position:absolute;right:-50px;bottom:-70px;width:220px;height:220px;border-radius:50%;border:26px solid var(--pink);opacity:.9}
.hero .portrait{position:relative;width:180px;height:180px;object-fit:cover;object-position:50% 12%;border-radius:50%;background:#fff;border:6px solid #fff;box-shadow:0 0 0 2px var(--blue);display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:600;font-size:13px;margin-left:12%}
.ql a{display:flex;align-items:center;gap:14px;padding:6px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500}
.ql a:hover{background:var(--bg);color:var(--ink)}
.ql .qi{width:36px;height:36px;border-radius:8px;background:var(--sky-2);border:1px solid var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.ql a small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.ql .chev{margin-left:auto;color:var(--ink-2)}
.nitem{display:flex;gap:16px;align-items:center;padding:10px 0;text-decoration:none;color:var(--ink)}
.nitem:hover{color:var(--blue)}
.thumb{width:64px;height:46px;border-radius:8px;flex:0 0 64px;display:flex;align-items:center;justify-content:center}
.nitem b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.nitem small{font-size:12px;color:var(--muted)}
.ev{display:flex;gap:16px;align-items:flex-start;padding:8px 0}
.ev .dt{flex:0 0 52px;height:50px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ev .dt small{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.ev .dt b{font-size:19px;font-weight:700}
.ev b.t{display:block;font-size:14px;font-weight:700}
.ev span{display:block;font-size:12px;color:var(--muted)}
.help{display:flex;align-items:center;gap:18px;background:var(--sky-2);border:1px solid var(--sky);border-radius:14px;padding:18px 22px;flex-wrap:wrap}
.help .hi{width:52px;height:52px;border-radius:50%;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:0 0 52px}
.help b{display:block;font-size:16px}
.help span{font-size:14px;color:var(--ink-2)}
.help .btn{margin-left:auto}

/* ---------- common ---------- */
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
.crumb a{font-weight:600}
.crumb b{color:var(--ink);font-weight:600}
.h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.card{background:#fff;border-radius:20px;padding:22px}
.card.lg{border-radius:24px;padding:26px;box-shadow:0 8px 24px rgba(36,46,224,.06)}
.card.blue{background:var(--blue);color:#fff}
.card.blue .mut{color:var(--sky)}
.card.soft{background:var(--bg);border:1px solid var(--line)}
.h2{font-size:17px;font-weight:800;margin-bottom:12px}
.h2.big{font-size:18px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--blue)}
.mut{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.between .h2{margin:0}
.small{font-size:13px}
.xs{font-size:12px}

.btn{height:44px;padding:0 18px;border-radius:12px;border:0;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn-blue{background:var(--blue);color:#fff} .btn-blue:hover{background:var(--blue-dk);color:#fff}
.btn-cta{background:var(--pink);color:#fff;font-size:18px;height:46px;padding:0 22px} .btn-cta:hover{background:#C9009F;color:#fff}
.btn-line{background:#fff;color:var(--blue);border:1.5px solid var(--blue)} .btn-line:hover{background:var(--sky-2)}
.btn-grey{background:#fff;color:var(--ink);border:1.5px solid var(--input)}
.btn-white{background:#fff;color:var(--blue)}
.btn-sm{height:36px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-danger{background:#fff;color:var(--pink-ink);border:1px solid var(--pink-line)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.b-all{background:var(--sky);color:var(--blue-dk)}
.b-dept{background:var(--neutral);color:var(--ink)}
.b-res{background:var(--pink-soft);color:var(--pink-ink)}
.b-conf{background:var(--ink);color:#fff}
.b-solid{background:var(--blue);color:#fff}

.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.inp{height:46px;border:1px solid var(--input);border-radius:12px;padding:0 12px;font-size:14px;background:#fff;font-weight:500;width:100%}
textarea.inp{height:auto;padding:12px;resize:vertical}
.inp:focus,.search:focus-within{outline:2px solid var(--blue);outline-offset:1px}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.form{display:flex;flex-direction:column;gap:16px}
.form-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.note{padding:12px 14px;border-radius:12px;background:var(--sky-2);font-size:14px;color:var(--blue-dk)}

.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-size:12px;letter-spacing:.06em;font-weight:700;padding:10px 8px}
.tbl td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td small{display:block;font-size:12px;color:var(--muted)}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--sky-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}

.file{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex:0 0 36px}
.f-PDF{background:var(--pink-soft);color:var(--pink-ink)} .f-XLSX{background:var(--sky);color:var(--blue-dk)}
.f-PPTX{background:#FFE7D1;color:#7A3300} .f-DOCX{background:var(--neutral);color:var(--ink)}

.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto;background:var(--sky);color:var(--blue)}
.av.p{background:var(--pink-soft);color:var(--pink-ink)} .av.b{background:var(--blue);color:#fff} .av.n{background:var(--neutral);color:var(--ink)}

.svc{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;text-decoration:none;color:var(--ink)}
.svc:hover{background:var(--bg);color:var(--ink)}
.svc .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 44px;background:var(--sky);color:var(--blue)}
.svc .ic.p{background:var(--pink-soft);color:var(--pink-line)}
.svc b{display:block;font-size:15px} .svc small{display:block;font-size:13px;color:var(--muted)}
.svc .chev{margin-left:auto;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{text-align:left;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:118px;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--sky);color:var(--ink)}
.tile .ic{width:44px;height:44px;border-radius:12px;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center}
.tile b{font-size:15px;line-height:1.3} .tile small{font-size:12px;color:var(--muted);margin-top:-6px}
.tile.on{background:var(--sky-2);border-color:var(--blue)} .tile.on .ic{background:var(--blue);color:#fff}

.date{flex:0 0 48px;height:48px;border-radius:12px;background:#fff;color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;line-height:1}
.date small{font-size:10px;font-weight:700}
.date.sky{background:var(--sky)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{text-decoration:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600}

/* stepper */
.steps{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:6px;flex:2 1 380px}
.steps li{display:flex;align-items:center;gap:6px;flex:1 1 0;min-width:0}
.steps .c{flex:0 0 24px;height:24px;border-radius:50%;border:2px solid var(--input);background:#fff;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.steps .t{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.steps .l{flex:1 1 8px;height:2px;background:var(--line);min-width:8px}
.steps li:last-child .l{display:none}
.steps li.done .c{background:var(--blue);border-color:var(--blue);color:#fff}
.steps li.done .t,.steps li.cur .t{color:var(--ink)}
.steps li.done .l{background:var(--blue)}
.steps li.cur .c{border-color:var(--blue);color:var(--blue)}
.steps li.rej .c{background:var(--pink-ink);border-color:var(--pink-ink);color:#fff}
.steps li.rej .t{color:var(--pink-ink)}
.req{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center}
.req .who{flex:1 1 200px;min-width:0}
.req .who b{display:block;font-size:15px}

/* home */
.ceo{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(36,46,224,.08)}
.ceo .bar{height:6px;background:var(--pink)}
.ceo .in{padding:32px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.ceo .pic{flex:0 0 150px;display:flex;flex-direction:column;align-items:center;gap:12px}
.ceo .ph{width:136px;height:136px;border-radius:50%;background:var(--sky);border:5px solid #fff;box-shadow:0 0 0 2px var(--blue);display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:13px;font-weight:600}
.ceo .txt{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px}
.ceo .q{font-size:64px;line-height:.6;font-weight:800;color:var(--pink);height:30px}
.ceo h2{font-size:28px;line-height:1.25;font-weight:800;letter-spacing:-.01em}
.ceo p.body{font-size:16px;line-height:1.7;color:var(--ink-3)}
.ceo .sig{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px}
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.news a{text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.news a:hover{border-color:var(--sky)}
.news b{font-size:16px;line-height:1.35}

/* department */
.dhero{background:var(--blue);color:#fff;padding:28px 30px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.dhero:after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;border:26px solid var(--pink)}
.dhero > *{position:relative;z-index:1}
.dhero h1{font-size:30px;font-weight:800;margin:6px 0 8px}
.dhero p{color:#EEF2FF;max-width:620px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--ink-2);cursor:pointer;font-size:14px}
.tabs button.on{color:var(--blue);font-weight:700;box-shadow:inset 0 -3px 0 var(--blue)}
.lock{border:1px dashed var(--pink-line)}

/* access level radios */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.lvl{text-align:left;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:100px}
.lvl b{display:flex;align-items:center;gap:8px;font-size:15px}
.lvl b:before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--blue);box-sizing:border-box;flex:0 0 16px}
.lvl span{font-size:13px;color:var(--ink-2)}
.lvl.on{background:var(--sky-2);border-color:var(--blue)}
.lvl.on b:before{background:var(--blue);box-shadow:inset 0 0 0 3px #fff}

.perm{display:inline-flex;width:26px;height:26px;border-radius:8px;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.p-y{background:var(--blue);color:#fff} .p-g{background:var(--sky);color:var(--blue-dk)} .p-n{background:var(--bg);color:#A0A6B8}

.kpi p{font-size:13px;color:var(--muted);font-weight:600} .kpi b{display:block;font-size:30px;font-weight:800}
.bar-track{height:8px;border-radius:4px;background:var(--blue-2);margin:14px 0 10px;overflow:hidden}
.bar-track i{display:block;height:8px;background:#fff;border-radius:4px}
.prog{height:6px;border-radius:3px;background:var(--sky);overflow:hidden} .prog i{display:block;height:6px;background:var(--blue)}

.drop{border:2px dashed var(--input);border-radius:16px;padding:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;text-align:center;font-weight:500;color:var(--ink-2);cursor:pointer}
.drop:hover{border-color:var(--blue);background:var(--sky-2)}

/* dialog + toast */
dialog{border:0;border-radius:24px;padding:0;width:min(620px,calc(100vw - 32px));box-shadow:0 24px 60px rgba(18,21,58,.25);color:var(--ink)}
dialog::backdrop{background:rgba(18,21,58,.45)}
dialog .dh{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
dialog .db{padding:22px 24px;display:flex;flex-direction:column;gap:16px;max-height:70vh;overflow:auto}
dialog .df{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:100;box-shadow:0 12px 32px rgba(18,21,58,.3);max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* login */
.login{min-height:100vh;display:flex;flex-wrap:wrap}
.login .art{flex:1 1 420px;min-height:340px;background:var(--blue);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .art:before{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:56px solid var(--pink)}
.login .art:after{content:"";position:absolute;left:-80px;top:200px;width:260px;height:260px;border-radius:50%;background:var(--blue-2)}
.login .art > *{position:relative;z-index:1}
.login h1{font-size:40px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.login .formside{flex:1 1 100%;display:flex;align-items:center;justify-content:center;padding:48px 16px}
.login-col{width:100%;max-width:440px}
.login form{width:100%;max-width:440px;background:#fff;border-radius:24px;padding:36px;box-shadow:0 12px 32px rgba(36,46,224,.10);display:flex;flex-direction:column;gap:18px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}

/* month tags + work calendar */
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.mo{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--ink)}
.mo b{font-size:13px;font-weight:800} .mo small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo.cur{border-color:var(--blue);border-width:2px} .mo.on{background:var(--blue);border-color:var(--blue);color:#fff} .mo.on small{color:var(--sky)}
.mo.tagged:not(.on) small{color:var(--pink-ink);font-weight:700}
.mtag{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.wcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.wcal i{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.06em}
.wcal .dy{min-height:56px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}
.wcal .dy.wk{background:var(--bg)}
.wcal .dy.td{box-shadow:inset 0 0 0 2px var(--blue)}
.wcal .dy.r-WFH{background:var(--sky);border-color:var(--sky);color:var(--blue-dk)}
.wcal .dy.r-Trip{background:var(--pink-soft);border-color:var(--pink-soft);color:var(--pink-ink)}
.wcal .dy small{font-size:11px;font-weight:700}
.wcal .dy.e{border:0;background:transparent}
@media (max-width:900px){ .months{grid-template-columns:repeat(6,minmax(0,1fr))} }

.mbanner{display:flex;align-items:center;gap:18px;background:var(--pink-soft);border-radius:14px;padding:16px 22px}
.mbanner .mdate{flex:0 0 auto;background:var(--pink);color:#fff;border-radius:12px;padding:8px 14px;text-align:center;line-height:1.1}
.mbanner .mdate b{display:block;font-size:20px;font-weight:800;letter-spacing:.04em}
.mbanner .mdate small{font-size:12px;font-weight:700}
.mbanner .eyebrow{color:var(--pink-ink)}
.mbanner h2{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:2px 0 0;color:var(--ink)}
.mbanner p.n{font-size:14px;color:var(--ink-2);margin-top:2px}

/* role visibility */
body:not(.role-admin) [data-need="admin"]{display:none!important}
body.role-employee [data-need="approver"]{display:none!important}
body.role-employee [data-need="fin"],body.role-hr [data-need="fin"]{display:none!important}

/* responsive */
@media (max-width:1180px){ .cols{grid-template-columns:minmax(0,1fr)} .hrow{grid-template-columns:minmax(0,1fr)} }
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--bg)}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:50;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(18,21,58,.45)}
  .hamb{display:flex}
  .top{padding:0 12px;gap:8px}
  .search{display:none}
  main.main{padding:20px 16px 32px}
  .hrow2{grid-template-columns:minmax(0,1fr)}
  .hero{flex-direction:column;min-height:0}
  .hero .copy{width:100%;clip-path:none;padding:24px}
  .hero .pic{position:relative;width:100%;height:190px}
  .hero .portrait{margin:0}
  .apps{right:12px}
  .menu.notif{right:12px;width:calc(100vw - 24px)}
}
</style>

KS6r+lz1GrXxmCvUzh/1MFLE8ZjXUKANhX+YGAO0Fis+LK95hq3vGxtcFhVMrZzV1dcwEJQVPLF71dG/a5//Z", "paras": ["Welcome to Lebara Nigeria, and congratulations on joining our growing family. We are delighted to have you with us and appreciate your decision to be part of this exciting journey as we build a bold, customer-centric telecommunications company in Nigeria.", "Lebara Nigeria is a recent entrant into the Nigerian telecom market as a Mobile Virtual Network Operator (MVNO), driven by a clear purpose: to deliver affordable, high-quality, and reliable mobile services that connect Nigerians at home and across the diaspora. Following the successful acquisition of our Tier 5 MVNO/MVNE licence, we launched our 0724 number series in mid-2025, marking an important milestone in our commitment to increase competition, choice, and digital inclusion in the Nigerian telecom ecosystem.", "As part of the global Lebara brand, which has a strong presence across Europe and other markets, Lebara Nigeria combines international experience with deep local insight. Our strategy is simple but powerful: challenge the status quo with innovative bundles, transparent pricing, digital-first services, and products that genuinely reflect the communication needs of Nigerians—especially families, entrepreneurs, and communities with strong international ties.", "At Lebara Nigeria, we believe telecommunications is about more than voice, data, and connectivity. It is about enabling opportunity, bridging distances, and empowering people to participate fully in the digital economy. We are intentional about supporting digital inclusion, improving access, and ensuring our services are designed with fairness, simplicity, and customer trust at the core.", "Our people are central to achieving this vision. We are building a culture anchored on integrity, respect, collaboration, accountability, and excellence. Every employee—regardless of role—is expected to think like an owner, act with purpose, and contribute ideas that help us serve our customers better. At Lebara Nigeria, performance is important, but so is how we achieve it: through teamwork, innovation, and doing what is right for the long term. As a way to ensure seamless communication within the team, we operate on a first name basis while maintaining the spirit of courtesy and mutual respect.", "As you begin your journey with us, I encourage you to embrace our values, be curious, speak up, and take pride in the impact your work creates. You are joining Lebara Nigeria at a defining moment, and together, we will shape a brand that Nigerians trust, recommend, and are proud to belong to.", "Once again, welcome to Lebara Nigeria. We are excited to build the future with you."], "closing": "Welcome to Lebara Nigeria—let’s build the future together."};

async function hashPw(pw, salt){
  try {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:new TextEncoder().encode(salt), iterations:120000}, key, 256);
    return 'pbkdf2$' + hex(bits);
  } catch(e) {           // very old browsers / locked-down previews only
    let h = 2166136261; for (const c of salt + pw) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return 'fnv$' + (h>>>0).toString(16);
  }
}

const isoToday = () => isoOf(new Date());

const remoteOn = (iso, who='You') => {
  const t = state.remote.find(r => r.type==='Trip' && r.who===who && r.from<=iso && iso<=r.to); if (t) return t;
  const w = state.wfhDay[who]; if (!w || iso < w.from) return null;
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d).getDay()===w.day ? {type:'WFH', who, note:'Weekly work-from-home day · '+WD[w.day], by:'HR'} : null;

async function checkNetwork(force){
  if (state.netSim==='office') { state.net = {st:'office', ip:'simulated'}; return state.net; }
  if (state.netSim==='off') { state.net = {st:'off', ip:'simulated'}; return state.net; }
  if (!force && !['unknown','checking'].includes(state.net.st) && Date.now()-(state.net.at||0) < 120000) return state.net;
  state.net = {st:'checking', ip:''};
  try {
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 5000);
    const res = await fetch('https://api.ipify.org?format=json', {signal: ctl.signal, cache:'no-store'}); clearTimeout(t);
    const ip = ((await res.json()) || {}).ip || '';
    state.net = {st: ipMatch(ip) ? 'office' : 'off', ip, at: Date.now()};
  } catch(e) { state.net = {st:'error', ip:'', at: Date.now()}; }
  return state.net;
}

      ${list.length ? list.map(x=>{ const ok = canSee(x), dl = canDownload(x), pend = pendingReq(x.id);

      </tbody></table></div>`;
  } else if (state.tab==='ann') {
    body = `<div style="padding:10px 22px 18px">${[0,1,2].map(n=>`<a href="#/announce/${id}-${n}" class="row" style="padding:14px 0;border-bottom:1px solid var(--line);gap:16px;text-decoration:none;color:var(--ink)"><span class="date sky">[DD]<small>MON</small></span><span><b style="display:block">[Department announcement]</b><span class="small mut">[One-line summary] · [Author]</span></span></a>`).join('')}</div>`;
  } else {
    body = `<div style="padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">${['HOD','Dept admin','','','',''].map((r,i)=>`<div class="row" style="border:1px solid var(--line);border-radius:14px;padding:12px"><span class="av ${i===0?'b':i===1?'p':''}">[${'ABCDEFGHIJKL'.substr(i*2,2)}]</span><span><b style="display:block;font-size:14px">[Full name]</b><span class="xs mut">[Job title]${r?' · '+r:''}</span></span></div>`).join('')}</div>`;
  }
  return page('dept-'+id, `<div class="cols"><div class="stack">
    ${crumb(d.group==='lead'?'C-Suite':'Departments', esc(d.name))}

        ${canUpload(id) ? `<button class="btn btn-cta" id="upBtn">${ic('upload',18,2.2)}Upload</button>` : `<span class="badge" style="background:rgba(255,255,255,.15);color:#fff">${ic('lock',13,2)} Members only can upload</span>`}</div>

      ${body}
    </section>
    ${hidden ? `<section class="card lock row" style="flex-wrap:wrap;gap:16px"><span class="ic" style="width:48px;height:48px;border-radius:14px;background:var(--pink-soft);color:var(--pink-ink);display:flex;align-items:center;justify-content:center">${ic('lock',22,2)}</span><div style="flex:1 1 280px"><h2 class="h2" style="margin-bottom:4px">${hidden} document${hidden>1?'s are':' is'} hidden from you</h2><p class="small" style="color:var(--ink-2)">Restricted and confidential files only appear for people who have been given access. Switch "Preview as" in your profile menu to see the difference.</p></div>${state.requests[id] ? `<span class="badge b-all">Request sent ${state.requests[id]} · awaiting owner</span>` : `<button class="btn btn-line" id="reqAcc">Request access</button>`}</section>` : ''}
  </div>
  <aside class="stack">
    ${canManage(id) ? reqCard(state.accReqs.filter(q=>q.st==='Pending' && q.doc.split('-')[0]===id), 'Access requests') : ''}
    <section class="card ${member||state.role==='ceo'||cooFree({dept:id})?'soft':'lock'}"><p class="eyebrow" style="color:var(--muted);margin-bottom:8px">YOUR ACCESS</p><p class="small" style="line-height:1.6;color:var(--ink-2)">${state.role==='ceo' ? 'You are the CEO: you can open and download every document here without permission.' : state.role==='coo' && id!=='ceo' ? 'You are the COO: you can open and download every document here without permission. Only CEO Office files need the CEO’s permission.' : member ? `You are a member of ${esc(d.name)}: you can view, download and upload this department’s files.${state.role==='hod'?' As head of department you also approve access requests.':''}` : `You are not a member of ${esc(d.name)}. You can view Company-wide files. Anything else, and any download, needs permission from ${approverOf(id)}.`}</p></section>
    ${id==='coo' ? `<section class="card blue"><p class="eyebrow" style="color:var(--sky)">COO OFFICE · EXPENSE CLAIMS</p><p style="font-size:15px;line-height:1.6;margin:6px 0 12px;color:#EEF2FF">${(n=>n+' claim'+(n===1?'':'s'))(state.cooClaims.filter(q=>q.rej===undefined&&q.done<6).length)} in progress${state.role==='coo'?` · <b style="color:#fff">${state.cooClaims.filter(q=>q.rej===undefined&&[2,3].includes(q.done)).length} waiting for you</b>`:''}</p><a class="btn btn-sm btn-white" href="#/dept/coo/expense">Open expense claims</a></section>` : ''}
    ${id==='fin' ? `<section class="card blue"><p class="eyebrow" style="color:var(--sky)">FINANCE · INVENTORY</p><p style="font-size:15px;line-height:1.6;margin:6px 0 12px;color:#EEF2FF">${state.inv.length} items tracked · <b style="color:#fff">${state.inv.filter(r=>r.qty<=r.re).length} low or out of stock</b></p><a class="btn btn-sm btn-white" href="#/inventory">Open inventory</a></section>` : ''}
    ${id==='hr' ? `<section class="card blue"><p class="eyebrow" style="color:var(--sky)">HR · DAILY TRACKER &amp; ATTENDANCE</p><p style="font-size:15px;line-height:1.6;margin:6px 0 12px;color:#EEF2FF">${TRK_TEAM.filter(t=>t.st==='Submitted').length + (myTrkToday()?1:0)} of ${TRK_TEAM.length+1} trackers submitted today</p><div class="row" style="gap:8px;flex-wrap:wrap"><a class="btn btn-sm btn-white" href="#/tracker/team">Tracker submissions</a><a class="btn btn-sm btn-white" href="#/attendance/team">Attendance</a></div></section>` : ''}
    <section class="card"><p class="eyebrow" style="color:var(--muted);margin-bottom:14px">HEAD OF DEPARTMENT</p>
      <div class="row" style="gap:14px"><span class="av b" style="width:60px;height:60px;font-size:15px;border:3px solid #fff;box-shadow:0 0 0 2px var(--blue)">[HD]</span><span><b style="display:block;font-size:16px">${esc((LEAD_PEOPLE[id]||["[Head's name]"])[0])}</b><span class="small mut" style="display:block">${esc(d.head)}</span><a href="mailto:[email]@lebara.ng" class="small" style="font-weight:600">[email]@lebara.ng</a></span></div></section>
    <section class="card"><div class="between"><h2 class="h2">Members <span class="mut" style="font-weight:600">([n])</span></h2><button class="btn btn-sm btn-grey" data-tab="members">View all</button></div>
      <div class="stack" style="gap:10px">${['HOD','Dept admin','',''].map((r,i)=>`<div class="row"><span class="av ${i===0?'b':i===1?'p':''}">[${'ABCDEFGH'.substr(i*2,2)}]</span><span><b style="display:block;font-size:14px">[Name]</b><span class="xs mut">[Job title]${r?' · '+r:''}</span></span></div>`).join('')}</div></section>

      <a href="#/announce/${id}-1" style="display:block;text-decoration:none;color:var(--ink);padding:10px 0"><b style="display:block;font-size:14px">[Announcement title]</b><span class="xs mut">[DD Mon] · [Author]</span></a></section>
    <section class="card soft"><p class="eyebrow" style="color:var(--muted);margin-bottom:10px">ACCESS LEVELS</p>

      <p class="note" style="margin-top:12px;font-size:13px"><b>CEO:</b> opens and downloads every document. <b>COO:</b> opens and downloads every department’s documents without a request; only CEO Office documents need the CEO’s permission.</p></section>
  </aside></div>`);

/* ===== Document access rules =====
   CEO: opens and downloads every document, never needs permission.
   Department members: view and download their own department's files (Company-wide + Department only),
     upload to their own department. The head of department also sees the department's restricted files.
   COO: opens and downloads every document except CEO Office files (those need the CEO's permission).
   CSO: like any department head — own office files; everything else needs permission.
   Everyone else: can view Company-wide files only; anything else, and any download, needs permission
     from the head of the owning department (the CEO approves CEO Office requests). */
const myDept = () => state.role==='ceo' ? 'ceo' : state.role==='coo' ? 'coo' : state.role==='cso' ? 'cso' : state.role==='hr' ? 'hr' : state.myDept;
const isMember = doc => myDept() === doc.dept;
const canManage = dept => state.role==='ceo' || (['coo','cso'].includes(state.role) && myDept()===dept) || (state.role==='hod' && myDept()===dept);
const canUpload = dept => myDept() === dept;
// The COO opens everything except CEO Office files. The CSO is treated like any other department head.
const cooFree = doc => state.role==='coo' && doc.dept!=='ceo';
function canSee(doc){
  if (state.role==='ceo' || cooFree(doc)) return true;
  if (state.grants[doc.id]) return true;
  if (isMember(doc)) return doc.level==='all' || doc.level==='dept' || ['hod','coo','cso'].includes(state.role);   // heads see all their own files
  return doc.level==='all';
}
function canDownload(doc){
  if (state.role==='ceo' || cooFree(doc)) return true;
  if (state.grants[doc.id]==='download') return true;
  return isMember(doc) && canSee(doc);
}
const approverOf = dept => dept==='ceo' ? 'the CEO' : dept==='coo' ? 'the COO' : dept==='cso' ? 'the CSO' : 'the Head of ' + DEPTS[dept].name;
const pendingReq = (docId) => state.accReqs.find(q => q.doc===docId && q.st==='Pending');
function requestAccess(doc, want){
  const id = 'AR-' + String(state.accReqs.length + 1).padStart(4,'0');
  state.accReqs.unshift({id, doc: doc.id, want, by: 'You', byDept: DEPTS[myDept()] ? DEPTS[myDept()].name : '[Department]', at: nowTime(), st: 'Pending'});
  state.notifs.unshift({for: ['ceo','coo','cso'].includes(doc.dept) ? doc.dept : 'hod:'+doc.dept, t: `Access request: ${doc.name}`, s: `You (${DEPTS[myDept()] ? DEPTS[myDept()].name : ''}) · wants to ${want==='download'?'view and download':'view'}`, h: '#/doc/'+doc.id, read:false});
  toast(`Request sent to ${approverOf(doc.dept)}`);
}
const reqCard = (list, title) => list.length ? `<section class="card" style="border:2px solid var(--sky)"><h2 class="h2" style="margin-bottom:4px">${title}</h2><p class="xs mut" style="margin-bottom:10px">Approve to give access. The requester is notified either way.</p>
  ${list.map(q=>{ const d = Object.values(DOCS).flat().find(x=>x.id===q.doc); return `<div style="padding:12px;border-radius:12px;background:var(--bg);margin-bottom:10px"><b style="display:block;font-size:14px">${esc(q.by)} · ${esc(q.byDept)}</b><span class="xs mut" style="display:block;margin-bottom:8px">Wants to <b>${q.want==='download'?'view and download':'view'}</b> “${esc(d?d.name:q.doc)}” · ${esc(q.at)}</span><span class="row" style="gap:8px"><button class="btn btn-sm btn-blue" data-areq="${q.id}" data-ok="1">Approve</button><button class="btn btn-sm btn-line" data-areq="${q.id}" data-ok="v">View only</button><button class="btn btn-sm btn-grey" data-areq="${q.id}" data-ok="0">Decline</button></span></div>`; }).join('')}</section>` : '';

V.doc = (docId) => {
  const doc = Object.values(DOCS).flat().find(x=>x.id===docId) || DOCS.ceo[0];
  state.doc = doc;
  if (!state.people || state.people.doc !== doc.id) {
    const dn = DEPTS[doc.dept].name;
    const list = [];
    const lead = LEAD_PEOPLE[doc.dept];
    list.push({name: lead ? lead[0] : '[Head of '+dn+']', role: (lead ? ROLES[doc.dept] : 'Head of Department') + ' · Owner', access:'owner', dl:'Yes'});
    if (doc.dept!=='ceo') list.push({name:CEO.name, role:'CEO · no permission needed', access:'exec', dl:'Yes'});
    if (doc.dept!=='ceo' && doc.dept!=='coo') list.push({name:COO.name, role:'COO · no permission needed', access:'exec', dl:'Yes'});
    if (doc.dept==='ceo') list.push({name:COO.name, role:'COO · needs the CEO’s permission', access:'no', dl:'—'});
    list.push({name: dn + ' members', role:'Department', access: (doc.level==='res'||doc.level==='conf') ? 'no' : 'member', dl: (doc.level==='res'||doc.level==='conf') ? '—' : 'Yes'});
    list.push({name:'[Name], Sales & Distribution', role:'Other department', access:'no', dl:'—'}, {name:'[Name], Customer Experience', role:'Other department', access:'no', dl:'—'});
    state.people = {doc: doc.id, list};
    state.log = [
      {who:'[Name]', what:'viewed', when:'[Today, 10:42] · [Device / IP]', c:'var(--blue)'},
      {who:'[Owner name]', what:`set access to ${LEVELS[doc.level].name}`, when:'[Today, 09:20]', c:'var(--pink)'},
      {who:'[Owner name]', what:`uploaded version ${doc.ver}`, when:'[Today, 09:14]', c:'var(--blue)'},
      {who:'[Name]', what:'was denied access (not authorised)', when:'[Yesterday, 16:05]', c:'var(--pink-ink)'},
      {who:CEO.name, what:'viewed', when:'[DD Mon, 14:30]', c:'var(--blue)'}
    ];
  }
  const d = DEPTS[doc.dept];
  if (!canSee(doc)) return page('dept-'+doc.dept, `<div class="stack">${crumb(`<a href="#/dept/${doc.dept}">${esc(d.name)}</a>`, 'Documents')}
    <section class="card lg" style="text-align:center;padding:40px 24px"><span style="display:inline-flex;width:64px;height:64px;border-radius:50%;background:var(--pink-soft);color:var(--pink-ink);align-items:center;justify-content:center">${ic('lock',28,2)}</span>
      <h1 class="h1" style="margin:16px 0 8px">You don’t have access to this document</h1>
      <p class="mut" style="max-width:560px;margin:0 auto 20px">This document belongs to ${esc(d.name)}. Only its members${doc.level==='res'||doc.level==='conf'?' named by the owner':''} can open it, so you need permission from ${approverOf(doc.dept)}. This attempt has been recorded in the access log.</p>
      <div class="row" style="gap:10px;justify-content:center;flex-wrap:wrap">${pendingReq(doc.id)?`<span class="badge b-all">Request sent ${pendingReq(doc.id).at} · waiting for ${approverOf(doc.dept)}</span>`:`<button class="btn btn-blue" id="reqDoc">Request access</button>`}<a class="btn btn-grey" href="#/dept/${doc.dept}">Back to ${esc(d.name)}</a></div></section></div>`);
  const granted = state.accReqs.filter(q=>q.doc===doc.id && q.st==='Approved' && state.grants[doc.id]).map(q=>`<tr><td><b>${esc(q.by)}</b><small>${esc(q.byDept)} · by request ${q.id}</small></td><td><span class="badge b-all">Granted</span></td><td>${q.want==='download'?'Yes':'View only'}</td><td class="num"><button class="btn btn-sm btn-danger" data-revreq="${q.id}">Revoke</button></td></tr>`).join('');
  const pList = state.people.list.map((p,i)=>{
    const b = p.access==='owner'?'<span class="badge b-solid">Owner</span>':p.access==='exec'?'<span class="badge b-conf">Always</span>':p.access==='member'?'<span class="badge b-solid">Member</span>':p.access==='yes'?'<span class="badge b-all">Granted</span>':'<span class="badge b-dept">Not granted</span>';
    const btn = p.access==='owner'?'<button class="btn btn-sm btn-grey" disabled>Owner</button>':p.access==='exec'?'<button class="btn btn-sm btn-grey" disabled title="No permission needed">Always</button>':p.access==='member'?'<button class="btn btn-sm btn-grey" disabled>Member</button>':p.access==='yes'?`<button class="btn btn-sm btn-danger" data-revoke="${i}">Revoke</button>`:`<button class="btn btn-sm btn-line" data-grant="${i}">Grant</button>`;
    return `<tr><td><b>${esc(p.name)}</b><small>${esc(p.role)}</small></td><td>${b}</td><td>${esc(p.dl)}</td><td class="num">${btn}</td></tr>`;
  }).join('');
  const lv = doc.level;
  return page('dept-'+doc.dept, `<div class="cols"><div class="stack">
    ${crumb(`<a href="#/dept/${doc.dept}">${esc(d.name)}</a>`, 'Documents', esc(doc.name))}
    <section class="card lg row" style="flex-wrap:wrap;gap:20px">
      <span class="file f-${doc.ext}" style="width:64px;height:64px;flex-basis:64px;border-radius:16px;font-size:14px">${doc.ext}</span>
      <div style="flex:1 1 300px;min-width:0"><div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:6px"><h1 style="font-size:24px;font-weight:800">${esc(doc.name)}</h1><span id="docBadge">${badge(lv)}</span></div>
        <p class="small mut">Version ${doc.ver} · ${doc.size} · Uploaded by <b style="color:var(--ink)">${esc(doc.by)}</b> on ${esc(doc.date)} · ${esc(doc.cat)}</p></div>
      <div class="row" style="flex-wrap:wrap;gap:10px">${canUpload(doc.dept)?'<label class="btn btn-line" style="cursor:pointer">Upload new version<input type="file" class="sr" id="newVer"></label>':''}${canDownload(doc) ? `<button class="btn btn-blue" id="dlDoc">${ic('download',18,2)}Download</button>` : pendingReq(doc.id) ? `<span class="badge b-all">Download requested · waiting for ${approverOf(doc.dept)}</span>` : `<button class="btn btn-line" id="reqDl">${ic('lock',16,2)}Request download</button>`}</div>
    </section>
    ${canManage(doc.dept) ? reqCard(state.accReqs.filter(q=>q.doc===doc.id && q.st==='Pending'), 'Requests for this document') : ''}

V.search = (q) => {
  const t = (q||'').toLowerCase().trim(); const has = x => String(x).toLowerCase().includes(t);
  const R = [];
  if (t) {
    PAGES.forEach(([n,h,i]) => { if (has(n)) R.push([n,'Page',h,i]); });
    Object.entries(DEPTS).forEach(([id,d]) => { if (has(d.name)||has(d.nav||'')||has(d.head)) R.push([d.name,'Department',`#/dept/${id}`,d.icon]); });
    Object.values(DOCS).flat().filter(canSee).forEach(x => { if (has(x.name)||has(x.cat)||has(DEPTS[x.dept].name)) R.push([x.cat,`Document · ${DEPTS[x.dept].name}`,`#/doc/${x.id}`,'file']); });
    NEWS.forEach(n => { if (has(n.title)||has(n.cat)) R.push([n.title,`News · ${n.cat}`,`#/news/${n.id}`,'news']); });
    Object.entries(HELP).forEach(([k,h]) => { if (has(h.t)) R.push([h.t,'IT quick fix',`#/help/${k}`,'help']); });
    USERS.forEach((u,i) => { if (has(u.join(' '))) R.push([u[5]||u[2],`Person · ${u[1]}`,`#/people/${i}`,'person']); });
  }
  return page('search', `<div class="stack" style="max-width:900px">

function render(){
  const parts = ROUTE.slice(2).split('/');
  const r = parts[0] || 'login';
  if (!['login','reset','setpw'].includes(r) && !state.user) { state.afterLogin = ROUTE; ROUTE = '#/login'; try { history.replaceState(null,'','#/login'); } catch(e) {} return render(); }
  document.body.classList.remove('nav-open');
  const app = document.getElementById('app');
  if (r !== 'dept') state.tab = state.tab; // keep
  let html;
  switch (r) {
    case 'login': html = V.login(); break;
    case 'home': html = V.home(); break;
    case 'dept': if (render._dept !== parts[1]) state.tab = 'docs'; render._dept = parts[1]; html = parts[1]==='coo' && parts[2]==='expense' ? V.expense(true) : V.dept(parts[1]); break;
    case 'doc': html = V.doc(parts[1]); break;
    case 'leave': html = V.leave(); break;
    case 'expense': html = V.expense(false); break;
    case 'it': html = V.it(parts[1]==='closed'); break;
    case 'hr': html = V.hr(); break;
    case 'finance': html = V.finance(parts[1]==='enquiry'); break;
    case 'admin': html = V.admin(); break;
    case 'news': html = parts[1] ? V.article(parts[1]) : V.news(); break;
    case 'announce': html = V.announce(parts[1]); break;
    case 'events': html = V.events(parts[1]); break;
    case 'people': html = V.person(parts[1]); break;
    case 'training': html = V.training(parts[1]); break;
    case 'help': html = V.help(parts[1]); break;
    case 'files': html = V.files(); break;
    case 'attendance': html = V.attendance(parts[1]); break;
    case 'tracker': html = V.tracker(parts[1], parts[2]); break;
    case 'inventory': html = V.inventory(); break;
    case 'search': html = V.search(decodeURIComponent(parts.slice(1).join('/'))); break;
    case 'reset': html = V.reset(); break;
    case 'setpw': html = V.setpw(parts[1]); break;
    case 'ceo': html = V.ceo(); break;
    case 'resources': html = V.resources(); break;
    case 'policies': html = V.policies(); break;
    case 'forms': html = V.forms(); break;
    case 'settings': html = V.settings(); break;
    case 'profile': html = V.profile(); break;
    default: html = V.home();
  }
  app.innerHTML = html;
  bind(r, parts);
  wireForms();
  saveState();
  if (r==='attendance' || r==='home') ensureNet();
  const target = r==='events' && parts[1] && document.getElementById('ev-'+parts[1]);
  if (target) { try { target.scrollIntoView({block:'center'}); } catch(e) {} } else window.scrollTo(0, 0);
}

/* ================= interactions ================= */
function wireForms(){
  document.querySelectorAll('#app form').forEach(f => {
    const h = f.onsubmit; if (!h) return;
    const fire = () => h.call(f, {preventDefault(){}, target: f});
    f.querySelectorAll('button:not([type="button"])').forEach(b => { b.type = 'button'; b.onclick = fire; });
    f.querySelectorAll('input').forEach(inp => { if (!/checkbox|file|radio/.test(inp.type)) inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); fire(); } }); });
  });
}
function bind(r, parts){
  const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);

      if (!pwOk(p1.value)) return err('#spErr', 'Your password does not meet all the rules above.');

      render(); toast(ok ? 'Approved · sent to HR' : 'Returned to the employee with your note'); });
    $$('[data-review]').forEach(b => b.onclick = () => { const k = b.dataset.review; state.trkReviewed[k] = true; if (k.startsWith('me-')) state.notifs.unshift({for:'me', t:'HR reviewed your daily tracker', s:todayStr(), h:'#/tracker/view/'+k, read:false}); render(); toast('Marked as reviewed by HR'); });
    const cs = $('#cmtSend'); if (cs) cs.onclick = () => { const t = $('#cmtText').value.trim(); if (!t) return; const k = decodeURIComponent(parts[2]); (state.trkComments[k] = state.trkComments[k] || []).push({by: isHR() ? 'HR' : 'Line manager', at: nowTime(), t}); if (k.startsWith('me-')) state.notifs.unshift({for:'me', t:'New comment on your daily tracker', s:t.slice(0,60), h:'#/tracker', read:false}); render(); toast('Comment sent to the employee'); };
    const rm = $('#trkRemind'); if (rm) rm.onclick = () => toast(`Reminder sent to ${TRK_TEAM.filter(t=>t.st==='Missing').length + (myTrkToday()?0:1)} staff who have not submitted`);
    const ex = $('#trkExp'); if (ex) ex.onclick = () => { download(`daily-tracker-submissions_${new Date().toISOString().slice(0,10)}.csv`, csvOf([['Employee','Department','Status','Line manager','Time','Tasks']].concat(trkAll().map(p=>[p.name,p.dept,trkDisp(p),p.st==='Submitted'?p.mgr:'',p.at,(p.rows||[]).length]))), 'text/csv'); toast('Submissions exported (CSV)'); };
    const tx = $('#taskExp'); if (tx) tx.onclick = () => { download(`daily-tracker-tasks_${new Date().toISOString().slice(0,10)}.csv`, csvOf([['Employee','Department','Date','Task','Category','Status','Result','Hours','Plan for tomorrow','Blockers']].concat(trkAll().filter(p=>p.mgr==='Approved').flatMap(p=>(p.rows||[]).map(t=>[p.name,p.dept,p.date,t.task,t.cat,t.st,t.res,t.hrs,p.next||'',p.blk||''])))), 'text/csv'); toast('Approved tasks exported (CSV)'); };
  }
  if (r==='inventory') {
    const q = $('#invQ'); q.oninput = () => { state.invF.q = q.value; const pos = q.selectionStart; render(); const n = $('#invQ'); n.focus(); try { n.setSelectionRange(pos,pos); } catch(e) {} };
    $('#invCat').onchange = e => { state.invF.cat = e.target.value; render(); };
    $$('[data-mv]').forEach(b => b.onclick = () => { state.invMove = {t: b.dataset.mv, code: b.dataset.code}; render(); const fm = $('#mvForm'); if (fm) try { fm.scrollIntoView({block:'center'}); } catch(e) {} });
    const mx = $('#mvX'); if (mx) mx.onclick = () => { state.invMove = null; render(); };
    $('#invExp').onclick = () => { download(`inventory_${new Date().toISOString().slice(0,10)}.csv`, csvOf([['Code','Item','Category','Location','In stock','Reorder at','Status']].concat(state.inv.map(r=>[r.code,r.item,r.cat,r.loc,r.qty,r.re,invStatus(r)[0]]))), 'text/csv'); toast('Inventory exported (CSV)'); };
    $$('[data-appr]').forEach(b => b.onclick = () => { const rq = state.invReq[b.dataset.appr]; const it = state.inv.find(x=>x.item===rq.item);
      if (it && it.qty < rq.qty) { toast(`Only ${it.qty} ${rq.item} in stock`); return; }
      if (it) it.qty -= rq.qty; rq.st = 'Issued'; rq.cls = 'b-solid';
      state.invLog.unshift({w:'Today, '+nowTime(), t:`Issued ${rq.qty} × ${rq.item} for request ${rq.ref}`, who:'You'}); render(); toast(`${rq.ref} approved and issued`); });
    const fm = $('#mvForm'); if (fm) fm.onsubmit = e => { e.preventDefault(); const mv = state.invMove; const err = t => { const x = $('#mvErr'); x.textContent = t; x.hidden = false; };
      const qty = Math.floor(+$('#mvQty').value || 0);
      if (mv.t==='add') { const name = $('#mvName').value.trim(); if (!name) return err('Enter the item name.');
        const code = 'INV-' + String(state.inv.length + 1).padStart(4,'0');
        state.inv.push({code, item:name, cat:$('#mvCat').value.trim()||'Other', loc:$('#mvLoc').value.trim()||'[Location]', qty:Math.max(0,qty), re:Math.max(0,Math.floor(+$('#mvRe').value||0))});
        state.invLog.unshift({w:'Today, '+nowTime(), t:`Added ${name} (${code}) with ${Math.max(0,qty)} in stock`, who:'You'}); state.invMove = null; render(); toast(`${name} added as ${code}`); return; }
      const it = state.inv.find(x=>x.code===$('#mvItem').value); const who = $('#mvWho').value.trim();
      if (qty < 1) return err('Enter a quantity of 1 or more.');
      if (mv.t==='issue') { if (qty > it.qty) return err(`Only ${it.qty} in stock.`); if (!who) return err('Say who the stock was issued to.'); it.qty -= qty; state.invLog.unshift({w:'Today, '+nowTime(), t:`Issued ${qty} × ${it.item} to ${who}`, who:'You'}); toast(`Issued ${qty} × ${it.item}`); }
      else if (mv.t==='recv') { it.qty += qty; state.invLog.unshift({w:'Today, '+nowTime(), t:`Received ${qty} × ${it.item}${who?' from '+who:''}`, who:'You'}); toast(`Received ${qty} × ${it.item}`); }
      else { const ref = 'IR-' + String(state.invReq.length + 1).padStart(4,'0'); state.invReq.unshift({ref, item:it.item, qty, by:'You · ' + (who||'[Reason]'), st:'Awaiting Finance', cls:'b-all'}); toast(`Request ${ref} sent to Finance`); }
      state.invMove = null; render(); };
  }
  if (r==='events') $$('[data-rsvp]').forEach(b => b.onclick = () => { const id = b.dataset.rsvp; state.rsvp[id] = !state.rsvp[id]; render(); toast(state.rsvp[id] ? 'RSVP saved · the organiser has been told' : 'RSVP withdrawn'); });
  if (r==='training') { const tn = $('#trainNext'); if (tn) tn.onclick = () => { const i = Math.min(+parts[1]||0, TRAIN.length-1); state.train[i] = Math.min(100, (Math.floor(state.train[i]/25)+1)*25); render(); toast(state.train[i]===100 ? 'Course complete · certificate added to your profile' : 'Module complete · progress saved'); }; }
  if (r==='profile') $('#meForm').onsubmit = e => { e.preventDefault(); state.me.phone = $('#mePhone').value; state.me.loc = $('#meLoc').value; render(); toast('Profile updated'); };
  if (r==='settings') { const cf = $('#chgForm'); if (cf) cf.onsubmit = async e => { e.preventDefault(); const acc = state.accounts[state.user];
      if (!acc || await hashPw($('#cpOld').value, acc.salt) !== acc.hash) return err('#cpErr', 'Your current password is wrong.');
      if (!pwOk($('#cpNew').value)) return err('#cpErr', 'The new password needs 8+ characters, a capital letter, a small letter and a number.');
      if ($('#cpNew').value !== $('#cpNew2').value) return err('#cpErr', 'The new passwords do not match.');
      acc.salt = newSalt(); acc.hash = await hashPw($('#cpNew').value, acc.salt); acc.set = new Date().toISOString(); render(); toast('Password changed'); }; }
  if (r==='settings') { const rt = $('#resetTest'); if (rt) rt.onclick = () => { resetTestData(); }; }
  if (r==='settings') $('#setForm').onsubmit = e => { e.preventDefault(); Object.assign(state.settings, {appr:$('#stAppr').checked, ann:$('#stAnn').checked, digest:$('#stDig').checked, start:$('#stStart').value}); toast('Settings saved'); };
  if (r==='search') $('#srchForm').onsubmit = e => { e.preventDefault(); const v = $('#srchQ').value.trim(); go('#/search/' + encodeURIComponent(v)); };
}

/* ================= employee dialog ================= */
let editUser = -1;
function openUser(i){
  editUser = i; const u = USERS[i] || ['', '', '', 'Employee', 'Active', '', ''];
  const $ = id => document.getElementById(id);
  $('usrH').textContent = i < 0 ? 'Add employee' : 'Edit employee';
  $('uDept').innerHTML = Object.values(DEPTS).map(d=>`<option ${d.name===u[1]?'selected':''}>${esc(d.name)}</option>`).join('');
  $('uRole').innerHTML = RBAC.map(r=>r[0].replace(' (IT)','')).map(r=>`<option ${r===u[3]?'selected':''}>${esc(r)}</option>`).join('');
  $('uStat').value = u[4];
  $('uId').value = i < 0 ? 'LEB-' + String(100 + USERS.length).padStart(4,'0') : u[0];
  $('uName').value = u[5] || ''; $('uMail').value = u[6] || ''; $('uTitle').value = u[2].startsWith('[') ? '' : u[2];
  const d = $('userDlg'); try { d.showModal(); } catch(e) { d.setAttribute('open',''); }
}
function closeUser(){ const d = document.getElementById('userDlg'); try { d.close(); } catch(e) { d.removeAttribute('open'); } }
document.querySelectorAll('#userDlg [data-uclose]').forEach(b => b.onclick = closeUser);
document.getElementById('uOk').onclick = () => {
  const $ = id => document.getElementById(id).value.trim();
  const row = [$('uId') || '[ID]', $('uDept'), $('uTitle') || '[Job title]', $('uRole'), $('uStat'), $('uName'), $('uMail')];
  if (editUser < 0) USERS.unshift(row); else USERS[editUser] = row;
  closeUser(); render(); toast(editUser < 0 ? `Employee ${row[0]} added` : `Employee ${row[0]} updated`);
};

/* ================= upload dialog ================= */
let upDept = null, upLevel = 'dept';
function openUpload(deptId){
  upDept = deptId; upLevel = 'dept';
  const dlg = document.getElementById('uploadDlg');
  document.getElementById('upCat').innerHTML = DEPTS[deptId].cats.map(c=>`<option>${esc(c)}</option>`).join('');
  document.getElementById('upTitle').value = '';
  document.getElementById('upFileName').textContent = 'Choose a file or drag it here · PDF, Word, Excel, PowerPoint';
  drawUpLevels();
  try { dlg.showModal(); } catch(e) { dlg.setAttribute('open',''); }
}
function drawUpLevels(){
  const box = document.getElementById('upLevels');
  box.innerHTML = Object.entries(LEVELS).map(([k,v])=>`<button type="button" class="lvl ${k===upLevel?'on':''}" role="radio" aria-checked="${k===upLevel}" data-ul="${k}"><b>${v.name}</b><span>${v.desc}</span></button>`).join('');
  box.querySelectorAll('[data-ul]').forEach(b => b.onclick = () => { upLevel = b.dataset.ul; drawUpLevels(); });
  document.getElementById('upPeopleWrap').hidden = !(upLevel==='res' || upLevel==='conf');
}
document.getElementById('upFile').onchange = e => { const f = e.target.files[0]; if (f) { document.getElementById('upFileName').textContent = f.name; const t = document.getElementById('upTitle'); if (!t.value) t.value = f.name.replace(/\.[^.]+$/,''); } };
function closeDlg(){ const d = document.getElementById('uploadDlg'); try { d.close(); } catch(e) { d.removeAttribute('open'); } }
document.querySelectorAll('#uploadDlg [data-close]').forEach(b => b.onclick = closeDlg);
document.getElementById('upOk').onclick = () => {
  closeDlg();
  const title = document.getElementById('upTitle').value.trim() || '[Untitled document]';
  const fn = document.getElementById('upFileName').textContent;
  const ext = (fn.match(/\.(pdf|xlsx?|pptx?|docx?)$/i)||[,'pdf'])[1].toUpperCase().replace(/^XLS$/,'XLSX').replace(/^PPT$/,'PPTX').replace(/^DOC$/,'DOCX');
  DOCS[upDept].unshift({id: upDept+'-u'+Date.now(), dept: upDept, name: title, cat: document.getElementById('upCat').value, ext: EXTS.includes(ext)?ext:'PDF', level: upLevel, ver: 1, size: '—', type:'doc', by: 'You', date: 'Today', dl: document.getElementById('upDl').checked});
  state.tab = 'docs'; render();
  toast(`Uploaded "${title}" · ${LEVELS[upLevel].badge}`);
};

loadState();
try { const se = localStorage.getItem(STORE+'.session'); if (se && state.accounts[se]) state.user = se; } catch(e) {}
if (!state.sheet || state.sheet.date !== todayStr()) state.sheet = freshSheet();
document.body.className = 'role-' + state.role;
render();
</script>
